[project]
name = "modern-data-architectures-i"
version = "0.1.0"
description = "Course materials for Modern Data Architectures for Big Data I: ingestion, storage and processing with NiFi, Kafka, Hadoop and Spark"
readme = "README.md"
authors = [
    { name = "Gustavo Martin Vela", email = "gustavo.martinvela@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]

[project.scripts]
modern-data-architectures-i = "modern_data_architectures_i:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
